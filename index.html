<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MediLog">
  <title>MediLog · 用药记录</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brandmark">M</div><div><h1>MediLog</h1><p>简单记录用药与库存</p></div></div>
    <button class="iconbtn" id="settingsBtn" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.55V20.3h-3v-.09a1.7 1.7 0 0 0-1.03-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.55-1.03H5.3v-3h.15A1.7 1.7 0 0 0 7 9.94a1.7 1.7 0 0 0-.34-1.88L6.6 8l2.12-2.12.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 11.7 4.7V4.6h3v.1a1.7 1.7 0 0 0 1.03 1.58 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.8 8l-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.55 1.03h.15v3h-.15A1.7 1.7 0 0 0 19.4 15Z"/></svg></button>
  </header>

  <section class="nextcard" id="hero"></section>
  <section class="summary" id="summary"></section>

  <div class="section-head"><h2>我的药物</h2><button class="textbtn" id="addTop">＋ 添加</button></div>
  <main class="med-list" id="medList"></main>

  <div class="section-head" id="historyHead"><h2>最近记录</h2><button class="textbtn" id="allHistoryBtn">查看全部</button></div>
  <section class="event-list" id="timeline"></section>
</div>

<div class="bottom-action"><button id="addBtn">＋ 添加药物</button></div>

<dialog id="medDialog"><form class="sheet" id="medForm">
  <div class="sheet-head"><h3 id="medTitle">添加药物</h3><button type="button" class="close" data-close="medDialog">×</button></div>
  <input type="hidden" id="medId">
  <div class="field"><label>药物名称</label><input id="medName" required placeholder="例如：达必妥"></div>
  <div class="grid2"><div class="field"><label>类型</label><select id="medType"><option>注射笔</option><option>预充针</option><option>片剂</option><option>胶囊</option><option>吸入剂</option><option>补充剂</option><option>其他</option></select></div><div class="field"><label>库存单位</label><input id="medUnit" value="支" required></div></div>
  <div class="grid2"><div class="field"><label>当前库存</label><input id="medStock" type="number" min="0" step="0.5" value="0" required></div><div class="field"><label>每次使用</label><input id="medDose" type="number" min="0.1" step="0.1" value="1" required></div></div>
  <div class="grid2"><div class="field"><label>计划间隔（天）</label><input id="medInterval" type="number" min="1" value="14" required></div><div class="field"><label>低库存提醒</label><input id="medLow" type="number" min="0" step="0.5" value="2"></div></div>
  <div class="field" id="seedWrap"><label>最近一次用药日期（可选）</label><input id="medSeed" type="date"></div>
  <div class="field"><label>备注（可选）</label><textarea id="medNotes" placeholder="剂量、部位或其他备注"></textarea></div>
  <button type="button" class="btn danger full" id="deleteBtn" style="display:none;margin-top:14px">删除药物和记录</button>
  <div class="sheet-actions"><button type="button" class="btn" data-close="medDialog">取消</button><button class="btn primary">保存</button></div>
</form></dialog>

<dialog id="doseDialog"><form class="sheet" id="doseForm">
  <div class="sheet-head"><h3>记录用药</h3><button type="button" class="close" data-close="doseDialog">×</button></div>
  <input type="hidden" id="doseMedId">
  <div class="field"><label>药物</label><input id="doseName" disabled></div>
  <div class="grid2"><div class="field"><label>日期</label><input id="doseDate" type="date" required></div><div class="field"><label>使用数量</label><input id="doseQty" type="number" min="0.1" step="0.1" required></div></div>
  <div class="field"><label>备注（可选）</label><input id="doseNote" placeholder="例如：左腹部"></div>
  <p class="hint" id="doseHint"></p>
  <div class="sheet-actions"><button type="button" class="btn" data-close="doseDialog">取消</button><button class="btn primary">确认用药</button></div>
</form></dialog>

<dialog id="restockDialog"><form class="sheet" id="restockForm">
  <div class="sheet-head"><h3>补充库存</h3><button type="button" class="close" data-close="restockDialog">×</button></div>
  <input type="hidden" id="restockMedId">
  <div class="field"><label>药物</label><input id="restockName" disabled></div>
  <div class="grid2"><div class="field"><label>日期</label><input id="restockDate" type="date" required></div><div class="field"><label>增加数量</label><input id="restockQty" type="number" min="0.1" step="0.1" value="1" required></div></div>
  <div class="field"><label>备注（可选）</label><input id="restockNote" placeholder="例如：药房领取"></div>
  <div class="sheet-actions"><button type="button" class="btn" data-close="restockDialog">取消</button><button class="btn primary">加入库存</button></div>
</form></dialog>

<dialog id="reminderDialog"><div class="sheet">
  <div class="sheet-head"><h3>设置手机提醒</h3><button type="button" class="close" data-close="reminderDialog">×</button></div>
  <input type="hidden" id="reminderMedId">
  <div class="reminder-box"><div class="reminder-title" id="reminderTitle"></div><div class="reminder-sub">第一版使用手机日历提醒，最稳定，也不需要把你的用药资料上传到服务器。</div></div>
  <div class="field"><label>提前多久提醒</label><select id="reminderBefore"><option value="0">当天提醒</option><option value="1" selected>提前 1 天</option><option value="2">提前 2 天</option><option value="3">提前 3 天</option></select></div>
  <button class="btn primary full" id="reminderExport" style="margin-top:16px">加入手机日历</button>
  <p class="hint">iPhone 下载后可用日历打开；Android 也可导入系统日历。真正的锁屏 Push 会作为下一阶段功能。</p>
</div></dialog>

<dialog id="historyDialog"><div class="sheet"><div class="sheet-head"><h3>全部记录</h3><button class="close" data-close="historyDialog">×</button></div><div class="event-list" id="allTimeline"></div></div></dialog>

<dialog id="settingsDialog"><div class="sheet">
  <div class="sheet-head"><h3>数据与备份</h3><button class="close" data-close="settingsDialog">×</button></div>
  <p class="hint">所有用药数据只保存在当前浏览器。本页面不会把药物名称、库存或用药历史上传到 GitHub。</p>
  <div class="settings-grid"><button class="btn" id="exportBtn">导出 JSON 备份</button><button class="btn soft" id="importBtn">导入备份</button><input id="importFile" type="file" accept="application/json" hidden></div>
</div></dialog>

<div class="toast" id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
